[project]
name = "visualmind"
version = "0.1.0"
description = "Local multimodal personal visual memory engine"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "huggingface-hub>=1.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.16.1",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "accelerate>=1.14.0",
    "imagehash>=4.3.2",
    "insightface>=1.0.1",
    "onnxruntime-gpu>=1.29.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualmind"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
