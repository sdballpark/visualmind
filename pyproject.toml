[project]
name = "visualmind"
version = "0.1.0"
description = "Local multimodal personal visual memory engine"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "huggingface-hub>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
