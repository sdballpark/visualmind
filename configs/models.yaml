# Model registry — weights live in $HF_HOME, never in this repo.
registry_version: 1
project: visualmind

models:
  image_embedding:
    provider: huggingface
    repo_id: google/siglip2-base-patch16-224
    revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
    license: apache-2.0
    purpose: semantic image-text retrieval
    precision: float16

  image_embedding_alternate:
    provider: huggingface
    repo_id: google/siglip2-so400m-patch14-384
    revision: e8e487298228002f3d8a82e0cd5c8ea9c567f57f
    license: apache-2.0
    purpose: evaluated alternative — underperformed base on this corpus, see evals
    precision: float16
    status: superseded

  visual_embedding:
    provider: huggingface
    repo_id: facebook/dinov2-base
    revision: f9e44c814b77203eaa57a6bdbbd535f21ede1415
    license: apache-2.0
    purpose: visual similarity, near-duplicate detection, clustering
    precision: float16
    status: planned

  vision_language:
    provider: huggingface
    repo_id: Qwen/Qwen3-VL-4B-Instruct
    revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
    license: apache-2.0
    purpose: captioning, entity extraction
    precision: bfloat16
    status: active

  text_embedding:
    provider: huggingface
    repo_id: BAAI/bge-large-en-v1.5
    revision: d4aa6901d3a41ba39fb536a557fa166f842b0e09
    license: mit
    purpose: caption embeddings for hybrid text/image retrieval
    precision: float32
    status: active

  face_detection:
    provider: insightface
    repo_id: buffalo_l
    revision: unversioned
    license: non-commercial-research-only
    license_note: InsightFace pretrained models require a separate licence for commercial use.
    purpose: face detection (SCRFD) and 512-d recognition embeddings (ArcFace)
    precision: float32
    runtime: onnxruntime CPU - onnxruntime-gpu is shadowed by the CPU package
    cache: ~/.insightface (not HF_HOME)
    status: active

  query_understanding:
    provider: huggingface
    repo_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    license: apache-2.0
    purpose: extract person, event and search terms from a raw query
    precision: bfloat16
    note: >-
      Runs beside the two encoders the API holds warm, which is what
      bounds the size. SigLIP2 and BGE together sit at 6.2 GB of the
      16 GB card once the CUDA context is counted, so the budget for a
      third resident model is around 8 GB after leaving headroom for a
      batch. 1.7B at bfloat16 uses well under that and leaves room to
      spare; a 4B would fit only by spending most of what is left.
      Thinking mode is disabled - the task is extraction against a
      roster it is given, not reasoning.
    status: active
